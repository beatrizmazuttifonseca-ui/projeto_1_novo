<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #2606f6;
            color: #04f1fa;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        main {
            background-color: #0c04f2;
            color: #06d8fd;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Make</h1>
        <p>Vou compartilhar ideias sobre maquiagem</p>
    </header>
    <main>
        <article>

            <img src="imagem-blog.jpg"
                alt="Pele Clean: Menos é Mais tendência atual é a maquiagem natural e iluminada, deixando o visual pesado no passado. Para o dia a dia, use apenas corretivo nos pontos necessários, blush cremoso e gloss. O resultado é um look fresco, radiante e pronto em apenas dois minutos"
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Beatriz Mazutti</p>
                <p>Inspire-se em maquiagem no seu estilo!</p>
                <button>💄<span>0</span></button>
                <button>👄<span>0</span></button>
            </div>
        </article>
        <article>

            <img src="imagem-blog.jpg"
                alt="Pele Clean: Menos é Mais tendência atual é a maquiagem natural e iluminada, deixando o visual pesado no passado. Para o dia a dia, use apenas corretivo nos pontos necessários, blush cremoso e gloss. O resultado é um look fresco, radiante e pronto em apenas dois minutos"
            <div>
                <h2>Meu segundo post</h2>
                <p class="artigo-autor">Beatriz Mazutti</p>
                <p>Inspire-se em maquiagem no seu estilo!</p>
                <button>💄<span>0</span></button>
                <button>👄<span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }

    })
        


</script>

</html>
