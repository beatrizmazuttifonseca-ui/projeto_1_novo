<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #a5fc04;
            color: #045816;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #50f803;
            color: #01530a;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Make</h1>
        <p>Vou compartilhar ideias sobre maquiagem</p>
    </header>
    <main>
        <article>

            <img src="imagem-blog.png"
                alt="A maquiagem perfeita é aquela que faz você se sentir bem. Um toque de corretivo, máscara de cílios e o seu batom favorito já bastam para mudar o dia. Celebre a sua beleza natural hoje!"

                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Maysa Marcuzzi</p>
                <p>Inspire-se com combinações criadas especialmente para você!</p>
                <button>🛍 <span>0</span></button>
                <button>🛒 <span>0</span></button>
            </div>
        </article>

            <img src="imagem-blog.png"
                alt="A maquiagem perfeita é aquela que faz você se sentir bem. Um toque de corretivo, máscara de cílios e o seu batom favorito já bastam para mudar o dia. Celebre a sua beleza natural hoje!"
                <h2>Meu segundo post</h2>
                <p class="artigo-autor">Maysa Marcuzzi</p>
                <p>Inspire-se com combinações criadas especialmente para você!</p>
                <button>🛍 <span>0</span></button>
                <button>🛒 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }

    })
        


</script>

</html>
